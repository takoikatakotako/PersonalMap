name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        run: |
          xcodebuild test \
            -project PersonalMap.xcodeproj \
            -scheme PersonalMap \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            | xcpretty || exit 1
